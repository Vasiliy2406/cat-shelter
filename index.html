<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Приют Котов</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #2b2b2b;
            color: #fff;
            font-family: 'Press Start 2P', cursive;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            user-select: none;
            overflow: hidden;
        }

        .cat-container {
            width: 200px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            background-color: #1e1e1e;
            border: 4px solid #555;
            border-radius: 20px;
        }

        .cat-container img {
            width: 160px; 
            height: 160px;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .stats {
            font-size: 10px;
            margin-bottom: 20px;
            text-align: center;
            line-height: 1.8;
        }

        .coins { color: #ffd700; font-size: 14px; }
        .energy-text { color: #00bfff; font-size: 12px; }
        
        .energy-icon {
            width: 16px;
            height: 16px;
            image-rendering: pixelated;
            vertical-align: middle;
            margin-bottom: 2px;
        }

        .buttons { display: flex; gap: 15px; }

        button {
            font-family: 'Press Start 2P', cursive;
            background-color: #4caf50;
            color: white;
            border: none;
            padding: 15px 10px;
            font-size: 10px;
            cursor: pointer;
            box-shadow: 4px 4px 0 #2e7d32;
            transition: transform 0.1s, box-shadow 0.1s;
            flex: 1;
            white-space: nowrap;
            text-align: center;
        }

        button:active:not(:disabled) {
            transform: translate(4px, 4px);
            box-shadow: 0 0 0 transparent !important;
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Навигация */
        .nav-bar { position: absolute; bottom: 20px; display: flex; gap: 10px; width: 90%; }
        .nav-btn { background-color: #333; color: white; font-size: 10px; padding: 10px; box-shadow: none; border: 2px solid #555; }
        .nav-btn.active { background-color: #555; border-color: #fff; }

        /* Экраны и скролл */
        .screen { 
            display: none; 
            flex-direction: column; 
            align-items: center; 
            width: 100%; 
            height: 100vh; 
            justify-content: flex-start;
            padding-top: 20px;
            overflow: hidden;
            box-sizing: border-box;
        }
        .screen.active { display: flex; }

        .scroll-container {
            width: 95%;
            max-width: 500px;
            flex: 1;
            overflow-y: auto;
            padding-bottom: 90px;
            margin-top: 10px;
        }

        .category-title {
            font-size: 12px;
            color: #aaa;
            margin: 20px 0 10px 0;
            text-align: left;
            width: 100%;
            border-bottom: 2px dashed #444;
            padding-bottom: 5px;
        }

        .items-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
        }

        .shop-item, .wardrobe-item { 
            background: #333; 
            padding: 10px; 
            border-radius: 10px; 
            text-align: center; 
            border: 2px solid #555; 
            position: relative; 
            cursor: pointer; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .shop-item p, .wardrobe-item p {
            font-size: 8px;
            margin: 5px 0;
            word-wrap: break-word;
        }

        .item-icon {
            width: 48px; 
            height: 48px;
            image-rendering: pixelated; 
            image-rendering: crisp-edges;
            margin-bottom: 5px;
            object-fit: contain;
        }

        .buy-btn {
            margin-top: 10px;
            width: 100%;
            padding: 8px 5px;
            font-size: 8px;
            box-shadow: 2px 2px 0 #2e7d32;
        }

        .wardrobe-item.selected { border-color: #4caf50; }
        .wardrobe-item.locked { opacity: 0.3; pointer-events: none; }
        .check { position: absolute; top: -10px; right: -10px; font-size: 20px; display: none; }
        .wardrobe-item.selected .check { display: block; }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: ИГРА -->
    <div id="screen-game" class="screen active">
        <div class="stats">
            Сытость: <span id="satiety">100</span>%<br>
            Монеты: <span class="coins" id="coins">0</span> 🪙<br>
            Энергия: <span class="energy-text" id="energy-text">10</span> <img src="lightning.png" class="energy-icon" alt="⚡">
        </div>

        <div class="cat-container" style="position: relative;">
            <div id="cat-wrapper" style="width: 160px; height: 160px; position: relative; transition: transform 0.1s;">
                <img src="cat.png" alt="Котик" id="cat-img" style="width: 100%; height: 100%; image-rendering: pixelated;">
                <img src="" alt="Ошейник" id="collar-layer" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; image-rendering: pixelated;">
                <img src="" alt="Миска" id="bowl-layer" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; image-rendering: pixelated;">
            </div>
        </div>

        <div class="buttons">
            <button id="feed-btn">Покормить (5🪙)</button>
            <button id="pet-btn">Погладить (+2🪙)</button>
            <button id="help-btn" style="display: none; background-color: #2196f3; box-shadow: 4px 4px 0 #0d47a1;">Помощь (25🪙)</button>
        </div>
        
        <div class="nav-bar">
            <button class="nav-btn active" onclick="switchTab('game')">🏠 Игра</button>
            <button class="nav-btn" onclick="switchTab('shop')">🛒 Магазин</button>
            <button class="nav-btn" onclick="switchTab('wardrobe')">👕 Гардероб</button>
        </div>
    </div>

    <!-- ЭКРАН 2: МАГАЗИН -->
    <div id="screen-shop" class="screen">
        <h2>Магазин</h2>
        <div class="stats">Монеты: <span class="coins shop-coins">0</span> 🪙</div>
        
        <div class="scroll-container">
            <h3 class="category-title">Ошейники</h3>
            <div class="items-grid">
                <div class="shop-item">
                    <img src="red_collar.png" class="item-icon" alt="Ошейник">
                    <p>Красный</p>
                    <button class="buy-btn" onclick="buyItem('collar_red', 50, this)">Купить (50🪙)</button>
                </div>
                <div class="shop-item">
                    <img src="blue_collar.png" class="item-icon" alt="Ошейник">
                    <p>Синий</p>
                    <button class="buy-btn" onclick="buyItem('collar_blue', 60, this)">Купить (60🪙)</button>
                </div>
                <div class="shop-item">
                    <img src="yellow_collar.png" class="item-icon" alt="Желтый ошейник">
                    <p>Желтый</p>
                    <button class="buy-btn" onclick="buyItem('collar_yellow', 90, this)">Купить (90🪙)</button>
                </div>
            </div>

            <h3 class="category-title">Миски</h3>
            <div class="items-grid">
                <div class="shop-item">
                    <img src="green_bowl.png" class="item-icon" alt="Миска">
                    <p>Зеленая</p>
                    <button class="buy-btn" onclick="buyItem('bowl_green', 30, this)">Купить (30🪙)</button>
                </div>
                <div class="shop-item">
                    <img src="blue_bowl.png" class="item-icon" alt="Миска">
                    <p>Синяя</p>
                    <button class="buy-btn" onclick="buyItem('bowl_blue', 40, this)">Купить (40🪙)</button>
                </div>
            </div>
        </div>

        <div class="nav-bar">
            <button class="nav-btn" onclick="switchTab('game')">🏠 Игра</button>
            <button class="nav-btn active" onclick="switchTab('shop')">🛒 Магазин</button>
            <button class="nav-btn" onclick="switchTab('wardrobe')">👕 Гардероб</button>
        </div>
    </div>

    <!-- ЭКРАН 3: ГАРДЕРОБ -->
    <div id="screen-wardrobe" class="screen">
        <h2>Гардероб</h2>
        <div class="stats">Выбери, что надеть</div>
        
        <div class="scroll-container">
            <h3 class="category-title">Ошейники</h3>
            <div class="items-grid">
                <div class="wardrobe-item selected" onclick="equipItem('collar', 'none', this)">
                    <span style="font-size: 32px; display: block; height: 48px; line-height: 48px;">❌</span>
                    <p>Без ошейника</p>
                    <span class="check">✅</span>
                </div>
                <div class="wardrobe-item locked" id="item-collar_red" onclick="equipItem('collar', 'collar_red', this)">
                    <img src="red_collar.png" class="item-icon" alt="Красный ошейник">
                    <p>Красный</p>
                    <span class="check" style="display: none;">✅</span>
                </div>
                <div class="wardrobe-item locked" id="item-collar_blue" onclick="equipItem('collar', 'collar_blue', this)">
                    <img src="blue_collar.png" class="item-icon" alt="Синий ошейник">
                    <p>Синий</p>
                    <span class="check" style="display: none;">✅</span>
                </div>
                <div class="wardrobe-item locked" id="item-collar_yellow" onclick="equipItem('collar', 'collar_yellow', this)">
                    <img src="yellow_collar.png" class="item-icon" alt="Желтый ошейник">
                    <p>Желтый</p>
                    <span class="check" style="display: none;">✅</span>
                </div>
            </div>

            <h3 class="category-title">Миски</h3>
            <div class="items-grid">
                <div class="wardrobe-item" id="item-bowl_red" onclick="equipBowl('bowl_red', this)">
                    <img src="red_bowl.png" class="item-icon" alt="Красная миска">
                    <p>Красная</p>
                    <span class="check">✅</span>
                </div>
                <div class="wardrobe-item locked" id="item-bowl_green" onclick="equipBowl('bowl_green', this)">
                    <img src="green_bowl.png" class="item-icon" alt="Зеленая миска">
                    <p>Зеленая</p>
                    <span class="check" style="display: none;">✅</span>
                </div>
                <div class="wardrobe-item locked" id="item-bowl_blue" onclick="equipBowl('bowl_blue', this)">
                    <img src="blue_bowl.png" class="item-icon" alt="Синяя миска">
                    <p>Синяя</p>
                    <span class="check" style="display: none;">✅</span>
                </div>
            </div>
        </div>

        <div class="nav-bar">
            <button class="nav-btn" onclick="switchTab('game')">🏠 Игра</button>
            <button class="nav-btn" onclick="switchTab('shop')">🛒 Магазин</button>
            <button class="nav-btn active" onclick="switchTab('wardrobe')">👕 Гардероб</button>
        </div>
    </div>

    <script>
        // --- БЕЗОПАСНАЯ ЗАГРУЗКА ДАННЫХ ---
        let satiety = Number(localStorage.getItem('satiety'));
        let coins = Number(localStorage.getItem('coins'));
        let energy = Number(localStorage.getItem('energy'));
        let currentCollar = localStorage.getItem('currentCollar') || 'none';
        let currentBowl = localStorage.getItem('currentBowl') || 'bowl_red'; 

        if (isNaN(satiety)) satiety = 100;
        if (isNaN(coins)) coins = 0;
        if (isNaN(energy)) energy = 10;

        let maxEnergy = 10;
        let isOffended = false;  
        let isEating = false; 

        // --- МАГИЯ ОФЛАЙН-ВОССТАНОВЛЕНИЯ ---
        let lastTime = Number(localStorage.getItem('lastTime'));
        
        if (!isNaN(lastTime) && lastTime > 0) {
            let timePassed = Date.now() - lastTime; 
            let secondsPassed = Math.floor(timePassed / 1000);

            let energyToAdd = Math.floor(secondsPassed / 15);
            if (energyToAdd > 0) energy = Math.min(maxEnergy, energy + energyToAdd); 

            let satietyToRemove = Math.floor(secondsPassed / 300);
            if (satietyToRemove > 0) satiety = Math.max(5, satiety - satietyToRemove); 
        } else {
            satiety = 100;
            energy = 10;
        }

        // --- ФУНКЦИИ ---
        function saveGame() {
            localStorage.setItem('satiety', satiety);
            localStorage.setItem('coins', coins);
            localStorage.setItem('energy', energy);
            localStorage.setItem('lastTime', Date.now());
            localStorage.setItem('currentCollar', currentCollar);
            localStorage.setItem('currentBowl', currentBowl);
        }

        function updateCatImage() {
            const catImg = document.getElementById('cat-img');
            const collarLayer = document.getElementById('collar-layer');

            if (isEating) {
                collarLayer.style.display = 'none';
                return; 
            }

            if (satiety < 30) catImg.src = 'cat_sad.png'; 
            else catImg.src = 'cat.png';

            if (currentCollar === 'collar_red') {
                collarLayer.src = 'cat_red_collar.png'; 
                collarLayer.style.display = 'block';
            } else if (currentCollar === 'collar_blue') {
                collarLayer.src = 'cat_blue_collar.png'; 
                collarLayer.style.display = 'block';
            } else if (currentCollar === 'collar_yellow') {
                collarLayer.src = 'cat_yellow_collar.png';
                collarLayer.style.display = 'block';
            } else {
                collarLayer.style.display = 'none'; 
            }
        }

        function updateUI() {
            document.getElementById('satiety').innerText = Math.floor(satiety);
            document.getElementById('coins').innerText = coins;
            document.getElementById('energy-text').innerText = energy;
            
            const feedBtn = document.getElementById('feed-btn');
            const petBtn = document.getElementById('pet-btn');
            const helpBtn = document.getElementById('help-btn');

            if (satiety < 30) {
                feedBtn.style.backgroundColor = '#ff9800'; 
                feedBtn.style.boxShadow = '4px 4px 0 #e65100'; 
            } else {
                feedBtn.style.backgroundColor = '#4caf50'; 
                feedBtn.style.boxShadow = '4px 4px 0 #2e7d32'; 
            }

            updateCatImage(); 

            if (satiety <= 0 && coins < 5 && !isOffended) {
                helpBtn.style.display = 'block'; 
                feedBtn.style.display = 'none';
                petBtn.style.display = 'none';
            } else {
                helpBtn.style.display = 'none'; 
                feedBtn.style.display = 'block';
                petBtn.style.display = 'block';
            }

            if (energy <= 0) {
                petBtn.disabled = true;
                petBtn.innerText = "Нет сил";
            } else if (!isOffended) {
                petBtn.disabled = false;
                petBtn.innerText = "Погладить (+2🪙)";
            }

            saveGame(); 
        }

        function switchTab(tabName) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('screen-' + tabName).classList.add('active');
            
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`.nav-btn[onclick="switchTab('${tabName}')"]`).classList.add('active');

            if (tabName === 'shop') {
                document.querySelectorAll('.shop-coins').forEach(el => el.innerText = coins);
            }
        }

        function buyItem(itemId, price, btnElement) {
            if (localStorage.getItem('item_' + itemId) === 'true') {
                alert("Вы уже купили этот предмет!");
                return;
            }

            if (coins >= price) {
                coins -= price;
                updateUI(); 
                alert("Покупка успешна! Предмет добавлен в гардероб.");
                
                const wardrobeItem = document.getElementById('item-' + itemId);
                if (wardrobeItem) wardrobeItem.classList.remove('locked');
                
                btnElement.innerText = "Уже куплено";
                btnElement.disabled = true;
                btnElement.style.backgroundColor = '#555';
                btnElement.style.boxShadow = '4px 4px 0 #222';
                btnElement.style.color = '#aaa';

                localStorage.setItem('item_' + itemId, 'true');
            } else {
                alert("Не хватает монет!");
            }
        }

        function equipItem(type, itemId, element) {
            if (type === 'collar') {
                currentCollar = itemId;
                
                document.querySelectorAll('#screen-wardrobe .wardrobe-item').forEach(el => {
                    if (el.getAttribute('onclick') && el.getAttribute('onclick').includes('equipItem')) {
                        el.classList.remove('selected');
                        const check = el.querySelector('.check');
                        if (check) check.style.display = 'none';
                    }
                });

                element.classList.add('selected');
                const currentCheck = element.querySelector('.check');
                if (currentCheck) currentCheck.style.display = 'block';
                
                updateCatImage(); 
                saveGame(); 
            }
        }

        function equipBowl(bowlId, element) {
            currentBowl = bowlId;
            
            document.querySelectorAll('#screen-wardrobe .wardrobe-item').forEach(el => {
                if (el.getAttribute('onclick') && el.getAttribute('onclick').includes('equipBowl')) {
                    el.classList.remove('selected');
                    const check = el.querySelector('.check');
                    if (check) check.style.display = 'none';
                }
            });

            element.classList.add('selected');
            const currentCheck = element.querySelector('.check');
            if (currentCheck) currentCheck.style.display = 'block';
            
            saveGame(); 
        }

        // --- ЗАПУСК ИГРЫ (Оборачиваем в DOMContentLoaded, чтобы кнопки точно были готовы) ---
        document.addEventListener('DOMContentLoaded', () => {
            
            // Привязка кнопок
            document.getElementById('feed-btn').addEventListener('click', () => {
                if (isOffended) {
                    alert("Кот обиделся и отказывается есть! Подожди, пока он остынет.");
                    return; 
                }

                if (coins >= 5) {
                    coins -= 5;
                    satiety += 20; 
                    if (satiety > 100) satiety = 100; 
                    
                    isEating = true; 
                    document.getElementById('collar-layer').style.display = 'none';
                    document.getElementById('cat-img').src = 'cat_eat.png'; 
                    
                    const bowlLayer = document.getElementById('bowl-layer');
                    if (currentBowl === 'bowl_blue') bowlLayer.src = 'blue_bowl_eat.png';
                    else if (currentBowl === 'bowl_green') bowlLayer.src = 'green_bowl_eat.png';
                    else bowlLayer.src = 'red_bowl_eat.png';
                    
                    bowlLayer.style.display = 'block';
                    
                    setTimeout(() => { 
                        bowlLayer.style.display = 'none';
                        isEating = false; 
                        updateCatImage(); 
                    }, 1000);
                    
                    updateUI();
                } else {
                    alert("Не хватает монет! Гладь кота, чтобы заработать.");
                }
            });

            document.getElementById('pet-btn').addEventListener('click', () => {
                if (isOffended) return; 
                if (satiety <= 0) {
                    alert("Кот слишком голоден! Сначала покорми его.");
                    return;
                }
                if (energy <= 0) return; 

                energy -= 1; 
                coins += 2;
                satiety -= 1; 
                if (satiety < 0) satiety = 0;
                
                const catWrapper = document.getElementById('cat-wrapper');
                catWrapper.style.transform = "scale(1.1)";
                setTimeout(() => { catWrapper.style.transform = "scale(1)"; }, 100);
                
                updateUI();
            });

            document.getElementById('help-btn').addEventListener('click', () => {
                coins += 25; 
                isOffended = true; 
                alert("Приют прислал 25 монет на еду! Но кот обиделся и не хочет играть 15 минут.");
                updateUI(); 

                const petBtn = document.getElementById('pet-btn');
                petBtn.disabled = true;
                petBtn.innerText = "Обиделся...";

                setTimeout(() => {
                    isOffended = false;
                    updateUI(); 
                }, 15000); 
            });

            // Таймеры
            setInterval(() => {
                if (satiety > 0) { satiety -= 1; updateUI(); }
            }, 15000);

            setInterval(() => {
                if (energy < maxEnergy) { energy += 1; updateUI(); }
            }, 15000);

            // Проверка покупок при загрузке
            const items = ['collar_red', 'collar_blue', 'collar_yellow', 'bowl_green', 'bowl_blue'];
            items.forEach(item => {
                if (localStorage.getItem('item_' + item) === 'true') {
                    const el = document.getElementById('item-' + item);
                    if (el) el.classList.remove('locked');
                    
                    const shopBtn = document.querySelector(`button[onclick*="${item}"]`);
                    if (shopBtn) {
                        shopBtn.innerText = "Уже куплено";
                        shopBtn.disabled = true;
                        shopBtn.style.backgroundColor = '#555';
                        shopBtn.style.boxShadow = '4px 4px 0 #222';
                        shopBtn.style.color = '#aaa';
                    }
                }
            });

            // Синхронизация галочек
            const allItems = document.querySelectorAll('#screen-wardrobe .wardrobe-item');
            allItems.forEach(el => {
                el.classList.remove('selected');
                const check = el.querySelector('.check');
                if (check) check.style.display = 'none';
            });

            let targetCollar = document.getElementById('item-' + currentCollar) || document.querySelector('#screen-wardrobe .wardrobe-item[onclick*="none"]');
            if (targetCollar) {
                targetCollar.classList.add('selected');
                targetCollar.querySelector('.check').style.display = 'block';
            }

            let targetBowl = document.getElementById('item-' + currentBowl);
            if (targetBowl) {
                targetBowl.classList.add('selected');
                targetBowl.querySelector('.check').style.display = 'block';
            }

            // Старт
            updateUI();
            
            // Предзагрузка
            const images = [
                'cat.png', 'cat_sad.png', 'cat_eat.png',
                'red_bowl_eat.png', 'green_bowl_eat.png', 'blue_bowl_eat.png', 
                'cat_red_collar.png', 'cat_blue_collar.png', 'cat_yellow_collar.png'
            ];
            images.forEach(src => { const img = new Image(); img.src = src; });
        });
    </script>
</body>
</html>
