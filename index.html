<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Приют Котов</title>
    <!-- Подключаем пиксельный шрифт -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #2b2b2b;
            color: #fff;
            font-family: 'Press Start 2P', cursive;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            user-select: none;
        }

        /* Контейнер для кота, чтобы картинка не размывалась */
        .cat-container {
            width: 200px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            background-color: #1e1e1e;
            border: 4px solid #555;
            border-radius: 20px;
        }

        /* Магия пиксель-арта: растягиваем, но сохраняем четкость */
        .cat-container img {
            width: 160px; 
            height: 160px;
            image-rendering: pixelated; /* Это свойство делает пиксели четкими! */
            image-rendering: crisp-edges;
        }

        .stats {
            font-size: 10px;
            margin-bottom: 20px;
            text-align: center;
            line-height: 1.8;
        }

        .coins {
            color: #ffd700;
            font-size: 14px;
        }

        .buttons {
            display: flex;
            gap: 15px;
        }

                button {
            font-family: 'Press Start 2P', cursive;
            background-color: #4caf50;
            color: white;
            border: none;
            padding: 15px 10px;
            font-size: 10px;
            cursor: pointer;
            box-shadow: 4px 4px 0 #2e7d32; /* Темно-зеленая тень для всех */
            transition: transform 0.1s, box-shadow 0.1s;
            flex: 1;
            white-space: nowrap;
            text-align: center;
        }

        /* Эффект нажатия: кнопка сдвигается, тень исчезает */
        button:active {
            transform: translate(4px, 4px); /* Сдвиг на размер тени */
            box-shadow: 0 0 0 transparent !important; /* !important перебивает JS-стиль */
        }
        
        /* Убедимся, что у кнопки еды нет жестко заданной тени в CSS */
        #feed-btn {
            background-color: #4caf50; 
        }
    </style>
</head>
<body>

    <div class="stats">
        Голод: <span id="hunger">100</span>%<br>
        Монеты: <span class="coins" id="coins">0</span> 🪙
    </div>

    <div class="cat-container">
        <!-- Сюда вставляется твоя картинка -->
        <img src="cat.png" alt="Котик" id="cat-img">
    </div>

        <div class="buttons">
        <button id="feed-btn">Покормить (5🪙)</button>
        <button id="pet-btn">Погладить (+2🪙)</button>
        <!-- Новая кнопка помощи -->
        <button id="help-btn" style="display: none; background-color: #2196f3; box-shadow: 4px 4px 0 #0d47a1;">Помощь (25🪙)</button>
    </div>

            <script>
        let hunger = 100; 
        let coins = 0;
        let isOffended = false; // Флаг: обиделся ли кот

        const hungerEl = document.getElementById('hunger');
        const coinsEl = document.getElementById('coins');
        const catImg = document.getElementById('cat-img');
        const feedBtn = document.getElementById('feed-btn');
        const petBtn = document.getElementById('pet-btn');
        const helpBtn = document.getElementById('help-btn');

        function updateUI() {
            hungerEl.innerText = Math.floor(hunger);
            coinsEl.innerText = coins;
            
            // Цвет и тень кнопки еды
            if (hunger < 30) {
                feedBtn.style.backgroundColor = '#ff9800'; 
                feedBtn.style.boxShadow = '4px 4px 0 #e65100'; 
            } else {
                feedBtn.style.backgroundColor = '#4caf50'; 
                feedBtn.style.boxShadow = '4px 4px 0 #2e7d32'; 
            }

            // Картинка кота
            if (hunger < 30) {
                catImg.src = 'cat_sad.png'; 
            } else {
                catImg.src = 'cat.png'; 
            }

            // ЛОГИКА КНОПКИ ПОМОЩИ (если голод 0 и монет 0, или монет меньше 5, а голод 0)
            if (hunger <= 0 && coins < 5 && !isOffended) {
                helpBtn.style.display = 'block'; // Показываем кнопку помощи
                // Скрываем остальные, чтобы не кликали впустую
                feedBtn.style.display = 'none';
                petBtn.style.display = 'none';
            } else {
                helpBtn.style.display = 'none'; // Прячем кнопку помощи
                feedBtn.style.display = 'block';
                petBtn.style.display = 'block';
            }
        }

        // Кот голодает
        setInterval(() => {
            if (hunger > 0) {
                hunger -= 1;
                updateUI();
            }
        }, 3000);

                // Покормить
        feedBtn.addEventListener('click', () => {
            // Если кот обижен, он отказывается есть
            if (isOffended) {
                alert("Кот обиделся и отказывается есть! Подожди, пока он остынет.");
                return; // Выходим, монеты не тратим, голод не растет
            }

            if (coins >= 5) {
                coins -= 5;
                hunger += 20; 
                if (hunger > 100) hunger = 100; 
                
                // Анимация поедания (опционально)
                catImg.style.transform = "scale(1.2)";
                setTimeout(() => { catImg.style.transform = "scale(1)"; }, 200);
                
                updateUI();
            } else {
                alert("Не хватает монет! Гладь кота, чтобы заработать.");
            }
        });

        // Погладить
        petBtn.addEventListener('click', () => {
            if (isOffended) return; // Если обиделся, не даем гладить

            if (hunger <= 0) {
                alert("Кот слишком голоден! Сначала покорми его.");
                return;
            }

            coins += 2;
            hunger -= 1; 
            if (hunger < 0) hunger = 0;
            
            catImg.style.transform = "scale(1.1)";
            setTimeout(() => { catImg.style.transform = "scale(1)"; }, 100);
            
            updateUI();
        });

        // НОВАЯ КНОПКА: Помощь из приюта
        helpBtn.addEventListener('click', () => {
            coins += 25; // Даем 25 монет
            isOffended = true; // Кот обиделся
            
            alert("Приют прислал 25 монет на еду! Но кот обиделся и не хочет играть 15 минут.");
            
            updateUI(); // Обновляем экран (кнопка помощи исчезнет, так как монет теперь больше 5)

            // Блокируем кнопку "Погладить" на 15 минут (900 000 миллисекунд)
            petBtn.disabled = true;
            petBtn.style.opacity = "0.5"; // Делаем её полупрозрачной
            petBtn.innerText = "Обиделся...";

            // Таймер обиды
            setTimeout(() => {
                isOffended = false;
                petBtn.disabled = false;
                petBtn.style.opacity = "1";
                petBtn.innerText = "Погладить (+2🪙)";
                updateUI();
            }, 15000); // 15 минут
        });

        // Запуск при старте
        updateUI();
    </script>
</body>
</html>
