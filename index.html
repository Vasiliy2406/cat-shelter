<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Приют Котов</title>
    <!-- Подключаем пиксельный шрифт -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #2b2b2b;
            color: #fff;
            font-family: 'Press Start 2P', cursive;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            user-select: none;
        }

        /* Контейнер для кота, чтобы картинка не размывалась */
        .cat-container {
            width: 200px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            background-color: #1e1e1e;
            border: 4px solid #555;
            border-radius: 20px;
        }

        /* Магия пиксель-арта: растягиваем, но сохраняем четкость */
        .cat-container img {
            width: 160px; 
            height: 160px;
            image-rendering: pixelated; /* Это свойство делает пиксели четкими! */
            image-rendering: crisp-edges;
        }

        .stats {
            font-size: 10px;
            margin-bottom: 20px;
            text-align: center;
            line-height: 1.8;
        }

        .coins {
            color: #ffd700;
            font-size: 14px;
        }

        .buttons {
            display: flex;
            gap: 15px;
        }

                button {
            font-family: 'Press Start 2P', cursive;
            background-color: #4caf50;
            color: white;
            border: none;
            padding: 15px 10px;
            font-size: 10px;
            cursor: pointer;
            box-shadow: 4px 4px 0 #2e7d32; /* Темно-зеленая тень для всех */
            transition: transform 0.1s, box-shadow 0.1s;
            flex: 1;
            white-space: nowrap;
            text-align: center;
        }

        /* Эффект нажатия: кнопка сдвигается, тень исчезает */
        button:active {
            transform: translate(4px, 4px); /* Сдвиг на размер тени */
            box-shadow: 0 0 0 transparent !important; /* !important перебивает JS-стиль */
        }
        
        /* Убедимся, что у кнопки еды нет жестко заданной тени в CSS */
        #feed-btn {
            background-color: #4caf50; 
        }
                /* Иконка молнии и текст энергии */
        .energy-text { 
            color: #00bfff; 
            font-size: 12px; 
        }
        
        .energy-icon {
            width: 16px;
            height: 16px;
            image-rendering: pixelated;
            vertical-align: middle;
            margin-bottom: 2px;
        }

        /* Стиль для заблокированных кнопок */
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="stats">
        Сытость: <span id="satiety">100</span>%<br>
        Монеты: <span class="coins" id="coins">0</span> 🪙<br>
        Энергия: <span class="energy-text" id="energy-text">10</span> <img src="lightning.png" class="energy-icon" alt="⚡">
    </div>

    <div class="cat-container">
        <!-- Сюда вставляется твоя картинка -->
        <img src="cat.png" alt="Котик" id="cat-img">
    </div>

        <div class="buttons">
        <button id="feed-btn">Покормить (5🪙)</button>
        <button id="pet-btn">Погладить (+2🪙)</button>
        <!-- Новая кнопка помощи -->
        <button id="help-btn" style="display: none; background-color: #2196f3; box-shadow: 4px 4px 0 #0d47a1;">Помощь (25🪙)</button>
    </div>

            <script>
                // Загружаем сохраненные данные или ставим значения по умолчанию
        let satiety = parseInt(localStorage.getItem('satiety')) ?? 100;
        let coins = parseInt(localStorage.getItem('coins')) ?? 0;
        let energy = parseInt(localStorage.getItem('energy')) ?? 10;
        let maxEnergy = 10;
        let isOffended = false; // Обиду не сохраняем, чтобы игрок не застрял навсегда  

        const satietyEl = document.getElementById('satiety');
        const coinsEl = document.getElementById('coins');
        const energyEl = document.getElementById('energy-text');
        const catImg = document.getElementById('cat-img');
        const feedBtn = document.getElementById('feed-btn');
        const petBtn = document.getElementById('pet-btn');
        const helpBtn = document.getElementById('help-btn');

                        function updateUI() {
            satietyEl.innerText = Math.floor(satiety);
            coinsEl.innerText = coins;
            energyEl.innerText = energy;
            
            // Цвет и тень кнопки еды
            if (satiety < 30) {
                feedBtn.style.backgroundColor = '#ff9800'; 
                feedBtn.style.boxShadow = '4px 4px 0 #e65100'; 
            } else {
                feedBtn.style.backgroundColor = '#4caf50'; 
                feedBtn.style.boxShadow = '4px 4px 0 #2e7d32'; 
            }

            // Картинка кота
            if (satiety < 30) {
                catImg.src = 'cat_sad.png'; 
            } else {
                // Если кот не ест прямо сейчас, ставим обычную картинку
                if (catImg.src !== 'cat_eat.png') {
                    catImg.src = 'cat.png'; 
                }
            }

            // ЛОГИКА КНОПКИ ПОМОЩИ
            if (satiety <= 0 && coins < 5 && !isOffended) {
                helpBtn.style.display = 'block'; 
                feedBtn.style.display = 'none';
                petBtn.style.display = 'none';
            } else {
                helpBtn.style.display = 'none'; 
                feedBtn.style.display = 'block';
                petBtn.style.display = 'block';
            }

            // Блокировка кнопки "Погладить", если нет энергии
            if (energy <= 0) {
                petBtn.disabled = true;
                petBtn.innerText = "Нет сил";
            } else if (!isOffended) {
                petBtn.disabled = false;
                petBtn.innerText = "Погладить (+2🪙)";
            }

            saveGame(); // Сохраняем каждое изменение (ВОТ ЗДЕСЬ)
        }

        // А вот функция сохранения должна идти СРАЗУ ПОСЛЕ updateUI
        function saveGame() {
            localStorage.setItem('satiety', satiety);
            localStorage.setItem('coins', coins);
            localStorage.setItem('energy', energy);
        }

                // Кот теряет сытость
        setInterval(() => {
            if (satiety > 0) {
                satiety -= 1;
                updateUI();
            }
        }, 3000);

        // Восстановление энергии (каждые 15 сек для теста)
        setInterval(() => {
            if (energy < maxEnergy) {
                energy += 1;
                updateUI();
            }
        }, 15000);

                // Покормить
        feedBtn.addEventListener('click', () => {
            if (isOffended) {
                alert("Кот обиделся и отказывается есть! Подожди, пока он остынет.");
                return; 
            }

            if (coins >= 5) {
                coins -= 5;
                satiety += 20; 
                if (satiety > 100) satiety = 100; 
                
                // Меняем картинку на "ест" и обратно
                catImg.src = 'cat_eat.png'; 
                setTimeout(() => { 
                    catImg.src = 'cat.png'; // Возвращаем обычного
                }, 1000);
                
                updateUI();
            } else {
                alert("Не хватает монет! Гладь кота, чтобы заработать.");
            }
        });

        // Погладить
        petBtn.addEventListener('click', () => {
            if (isOffended) return; 
            if (satiety <= 0) {
                alert("Кот слишком голоден! Сначала покорми его.");
                return;
            }
            if (energy <= 0) return; // Защита от кликов, если нет энергии

            energy -= 1; // Тратим энергию
            coins += 2;
            satiety -= 1; 
            if (satiety < 0) satiety = 0;
            
            catImg.style.transform = "scale(1.1)";
            setTimeout(() => { catImg.style.transform = "scale(1)"; }, 100);
            
            updateUI();
        });

        // Помощь из приюта
        helpBtn.addEventListener('click', () => {
            coins += 25; 
            isOffended = true; 
            
            alert("Приют прислал 25 монет на еду! Но кот обиделся и не хочет играть 15 минут.");
            
            updateUI(); 

            petBtn.disabled = true;
            petBtn.innerText = "Обиделся...";

            // Таймер обиды (Сейчас стоит 15 секунд для теста!)
            setTimeout(() => {
                isOffended = false;
                updateUI(); // Вернет кнопку в нормальное состояние
            }, 15000); 
        });

        // Запуск при старте
        updateUI();
    </script>
</body>
</html>
